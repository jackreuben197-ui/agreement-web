name: Sync GitLab to GitHub

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          
      - name: Sync GitLab → GitHub
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git config --global user.name "gitlab-sync"
          git config --global user.email "sync@example.com"
      
          # GitLab
          git remote add gitlab https://kong1985:${GL_TOKEN}@gitlab.com/darkalliance/agreement-web.git
          git fetch gitlab
      
          # 本地分支
          git checkout -B master gitlab/master
      
          # ✅ 关键：用 credential.helper 注入 PAT
          git config --global credential.helper store
          echo "https://kingofake:${GH_PAT}@github.com" > ~/.git-credentials
      
          git remote remove origin
          git remote add origin https://github.com/kingofake/agreement-web.git
      
          git push origin master --force
