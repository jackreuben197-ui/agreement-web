name: Sync GitLab to GitHub

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          
      - name: Sync GitLab → GitHub
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git config user.name "gitlab-sync"
          git config user.email "sync@example.com"
      
          git remote add gitlab https://kong1985:${GL_TOKEN}@gitlab.com/darkalliance/agreement-web.git
          git fetch gitlab
      
          git checkout -B master gitlab/master
      
          git remote set-url origin https://kingofake:${GH_PAT}@github.com/kingofake/agreement-web.git
          git push origin master --force
