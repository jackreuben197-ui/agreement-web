name: Sync GitLab → GitHub & Generate PB Runtime

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync & Build
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git config --global user.name "gitlab-sync"
          git config --global user.email "sync@example.com"

          echo "=== Checkout GitHub master ==="
          git checkout master || git checkout -b master

          echo "=== Fetch holdem/pb from GitLab ==="
          git remote add gitlab https://kong1985:${GL_TOKEN}@gitlab.com/darkalliance/agreement-web.git || true
          git fetch gitlab master
          git checkout gitlab/master -- holdem/

          echo "=== Build PB Runtime ==="
          npm ci
          npm run build

          echo "=== Commit ==="
          git add dist/ holdem/
          git commit -m "chore: sync from gitlab and generate pb runtime" || true

          echo "=== Push GitHub ==="
          git config --global credential.helper store
          echo "https://kingofake:${GH_PAT}@github.com" > ~/.git-credentials

          git remote remove origin || true
          git remote add origin https://github.com/kingofake/agreement-web.git

          git push origin master --force
